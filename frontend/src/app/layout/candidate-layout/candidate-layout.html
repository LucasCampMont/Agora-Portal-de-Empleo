<app-navbar></app-navbar>

<div class="flex">
  <app-candidate-sidebar
    (setupRequested)="openSetupModal($event)"
  ></app-candidate-sidebar>

  <main class="min-w-0 flex-1 p-4">
    <router-outlet></router-outlet>
  </main>
</div>

<app-footer></app-footer>

@if (setupModalSection(); as section) {
  <div class="fixed inset-0 z-50 grid place-items-center p-4 sm:p-6">
    <button
      type="button"
      class="absolute inset-0 bg-slate-950/50 backdrop-blur-[2px]"
      aria-label="Cerrar ventana"
      (click)="closeSetupModal()"
    ></button>

    <section
      role="dialog"
      aria-modal="true"
      aria-labelledby="setup-modal-title"
      class="relative z-10 max-h-[90vh] w-full max-w-2xl overflow-y-auto rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl"
    >
      <header class="mb-5 flex items-center justify-between gap-4">
        <h1 id="setup-modal-title" class="text-xl font-semibold text-slate-900">
        @switch (section) {
          @case ('profile') {
            Mi perfil
          }
          @case ('cv') {
            Mis CV
          }
          @case ('settings') {
            Configuración
          }
        }
      </h1>

        <button
          type="button"
          (click)="closeSetupModal()"
          aria-label="Cerrar ventana"
          class="grid size-9 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100"
        >
          ✕
        </button>
      </header>

      <app-setup [section]="section"></app-setup>
    </section>
  </div>
}
