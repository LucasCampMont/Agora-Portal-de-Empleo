<form
  role="search"
  (submit)="submitSearch($event)"
  class="flex flex-col gap-2 rounded-2xl border border-[#B8DAD6] bg-white p-2 shadow-sm focus-within:border-[#0A9292] focus-within:ring-4 focus-within:ring-[#0A9292]/10 sm:flex-row"
>
  <label for="job-search-query" class="sr-only">
    Describe el empleo que buscas
  </label>

  <div class="flex min-w-0 flex-1 items-center gap-3 px-3">
    <span aria-hidden="true" class="text-lg text-[#087A78]">⌕</span>

    <input
      id="job-search-query"
      type="search"
      [value]="query()"
      (input)="updateQuery($event)"
      placeholder="Describe el empleo que buscas..."
      class="h-11 min-w-0 flex-1 border-0 bg-transparent text-sm outline-none focus:ring-0"
    />

    <span class="hidden rounded-full bg-[#E7F7F5] px-2.5 py-1 text-xs font-medium text-[#087A78] sm:inline">
      Lenguaje natural
    </span>
  </div>

  <button
    type="submit"
    class="h-11 rounded-xl bg-[#0BAFA5] px-5 text-sm font-semibold text-white hover:bg-[#09998F]"
  >
    Buscar empleos
  </button>
</form>
