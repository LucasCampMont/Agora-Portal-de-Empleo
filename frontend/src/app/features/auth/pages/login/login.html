<div class="min-h-screen flex items-center justify-center bg-[#F1F5F9] p-4">

    <div class="w-full max-w-lg bg-white rounded-2xl shadow-lg p-10">

        <!-- Encabezado -->
        <div class="text-center mb-8">

            <h1 class="text-4xl font-bold tracking-tight text-[#064635]">
                Ágora
            </h1>

            <h2 class="text-2xl font-semibold text-[#0F172A] mt-4">
                Tu próximo paso profesional
            </h2>

            <p class="text-gray-500 mt-3">
                Encuentra oportunidades laborales de forma
                eficaz y simple.
            </p>

        </div>


        <!-- Formulario -->
        <form [formGroup]="loginForm">

            <div class="mb-5">

                <label
                    for="email"
                    class="block text-sm font-medium text-[#0F172A] mb-2"
                >
                    Correo electrónico
                </label>

                <input
                    id="email"
                    type="email"
                    formControlName="email"
                    placeholder="tu@email.com"
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl
                           focus:outline-none focus:ring-2 focus:ring-[#0B7A6B]"
                />

            </div>


            <div class="mb-3">

                <label
                    for="password"
                    class="block text-sm font-medium text-[#0F172A] mb-2"
                >
                    Contraseña
                </label>

                <input
                    id="password"
                    type="password"
                    formControlName="password"
                    placeholder="••••••••"
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl
                           focus:outline-none focus:ring-2 focus:ring-[#0B7A6B]"
                />

            </div>


            <!-- Recuperar contraseña -->
            <div class="text-right mb-6">

                <a
                    href="#"
                    class="text-sm text-[#0B7A6B] hover:text-[#064635]"
                >
                    ¿Olvidaste tu contraseña?
                </a>

            </div>


            <!-- Login -->
            <button
                type="submit"
                class="w-full py-3 bg-[#0B7A6B] text-white
                       font-semibold rounded-xl
                       hover:bg-[#064635] transition"
            >
                Iniciar sesión
            </button>

        </form>


        <!-- Separador -->
        <div class="flex items-center gap-3 my-7">

            <div class="flex-1 h-px bg-gray-200"></div>

            <span class="text-sm text-gray-400 whitespace-nowrap">
                o continúa con
            </span>

            <div class="flex-1 h-px bg-gray-200"></div>

        </div>


        <!-- Login social -->
        <div class="space-y-3">

            <button
                type="button"
                class="w-full py-3 border border-gray-300
                       rounded-xl font-medium text-[#0F172A]
                       hover:bg-gray-50 transition"
            >
                Continuar con Google
            </button>

            <button
                type="button"
                class="w-full py-3 border border-gray-300
                       rounded-xl font-medium text-[#0F172A]
                       hover:bg-gray-50 transition"
            >
                Continuar con LinkedIn
            </button>

        </div>


        <!-- Registro -->
        <div class="text-center mt-8">

            <p class="text-sm text-gray-500">
                ¿Aún no tienes una cuenta?
            </p>

            <a
                href="#"
                class="inline-block mt-1 font-semibold
                       text-[#0B7A6B] hover:text-[#064635]"
            >
                Crea tu cuenta en Ágora
            </a>

        </div>

    </div>

</div>
